unit_policy: 発電kWh/30分と容量/低下量kWを保持し換算しない
capacity_policy: 時点有効容量の分母未確定。snapshot行ID別の列値合計は物理容量やFY容量と同一視しない
outage_policy: 2版保持。復旧予定は日単位、実績復旧/初回公表は未観測。重複更新を統合せずinterval展開なし
