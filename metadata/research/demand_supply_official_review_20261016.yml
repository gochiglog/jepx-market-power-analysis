  block_scope: 同じブロック量が所属エリアごとに反復する。ブロック量をエリア間で加算しない。ブロックNoは時刻別識別。
  timing: 先頭行はファイル全体の最新更新。行別更新・初回公表日時ではない。取得日時も別。
  rate_check: 当該CSVの全構成項目/調整項と公式算定式の対応は未確定。公表値を保存し再計算しない。
