interval_scenarios:
  early: 停止開始以上、復旧予定日の00:00以前に30分全区間が入るセル
  late: 停止開始以上、復旧予定日の翌日00:00以前に30分全区間が入るセル
  recovery_date: 両シナリオとも主区分は境界不明として保持。該当flagのみ予定端点仮定を反映
  partial_start: コマ途中の開始は境界不明。全コマ停止としない
  unknown_recovery: 停止区間を生成しない。開始後の観測に未解決の終了不明記録が関係し得るため保留。年度末まで停止とは解釈しない
  invalid_start: 設備の時間範囲を限定できないためFY内照合を保留。実停止ではない
primary_state_priority:
- code: mapping_unavailable
  japanese: 設備対応不能/範囲未確認のため照合不可
- code: held_asset_period
  japanese: 設備同一性の期間矛盾/境界により保留
- code: held_invalid_dates
  japanese: 日時不正/前後矛盾により保留
- code: held_unknown_recovery
  japanese: 復旧予定不明/見通し矛盾により保留
- code: held_update_candidates
  japanese: 同一イベントか不明な更新候補により保留
- code: held_multiple_records
  japanese: 複数の異なる公表記録により保留
- code: held_date_boundary
  japanese: 開始部分コマ/復旧日の日内境界不明により保留
- code: matched_planned_stop
  japanese: snapshotの計画停止記録が予定シナリオに該当
- code: matched_unplanned_stop
  japanese: snapshotの計画外停止記録が予定シナリオに該当
- code: matched_reduction
  japanese: snapshotの出力低下記録が予定シナリオに該当
- code: matched_other
  japanese: その他の公表記録が予定シナリオに該当
- code: no_applicable_record
  japanese: snapshot内に該当する記録が見つからない（停止なしではない）
mapping_scope: 固定診断対応428元unitのみ。57元unitの未対応/範囲未確認、6元unitの全期間矛盾と個別セルの稼働日矛盾/境界は保留。探索plant一致は許可にしない
copy_handling: 全元行を保存。全15元セル（更新日時を含む）が一致する内容hashでコピーを識別。版を混ぜない。コピー行数はイベント数ではない
update_candidates: area/code/正規化unit/開始原値/停止区分/種別の候補群。異なる内容の複数行は保留。公式event IDではなく同一性は未確定。最新/最大を選ばない
no_applicable_record: 当該snapshotの定義した関連範囲で公表記録が見つからない。停止なし・利用可能・損失0ではない
panel_context: 各観測1行に4条件の主区分・context ID・nullable該当flag。contextの各memberから全原行と更新候補群へ追跡。context0は関連記録集合が空で、主区分は観測側に従う
scenario_flag: True=確定した予定端点シナリオで公表行が見つかる。False=既知範囲では見つからない。null=設備/期間/終了不明等で判定不能。ただし他の既知行が見つかればTrueとし、保留は主区分/context理由に保持
aggregation: 主区分は各snapshot/端点内で排他。1元観測は1回計数。異なるsnapshot/端点の部分和を足さない。各コマの元unitラベル数と期間の延べunitセル数を区別
null_policy: 数量の全欠測・空区分はnull。構造上0件の区分の件数のみ0。未知容量・出力を0にしない
