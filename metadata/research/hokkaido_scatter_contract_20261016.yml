reference_metric:
  name: 制度対象外公開設備の参照容量差〔MW〕
  formula: R_ref_MW = sum(capacity_reference_kw - generation_kwh_30min / 0.5) / 1000
  raw_energy_unit: kWh/30min
  average_power_unit: kW
  result_unit: MW
  capacity_assumption: RD-012の既存固定診断と同じ参照台帳値を観測期間中一定とする仮定。FY容量履歴の検証ではない。
  missing: 全不能null。不完全な部分和はR_ref_MWと件数・集合を保持し、R_ref_complete_MWは保留する。
  no_deductions: 公表停止平均低下量の控除なし。負値切上げ・未知の0化なし。
  public_records: 2snapshot×2端点の4条件を別の寄与表で保持。R_ref自体は4倍に反復しない。
