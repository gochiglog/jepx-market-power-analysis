    - CP932/Shift_JISのUnicode字形差(波ダッシュ等)あり。候補と検査用decoderを記録しrawは変換しない
    - 列名に単位がないため単位は公式仕様の追加確認が必要。HTTP MIMEはapplication/octet?stream;charset=UTF-8という応答をそのまま記録
