schema_version: 1
baseline:
  start: '2025-04-01'
  end: '2026-03-31'
  timezone: Asia/Tokyo
  periods_per_day: 48
  period_minutes: 30
panel_keys:
  market:
  - delivery_date
  - period
  - area
  asset:
  - delivery_date
  - period
  - plant_key
  - unit_key
  firm:
  - delivery_date
  - period
  - area
  - firm_canonical
sources:
- source_id: jepx_spot
  name: JEPXスポット市場
  reference_url: https://www.jepx.jp/electricpower/market-data/spot/
  reference_status: file_verified
  grain: 30分×全国/エリア
  primary_key_candidate:
  - delivery_date
  - period
  - market_scope
  - area
  - source_snapshot_id
  key_status: candidate_unverified
  information_timing: ex_ante
  intended_period:
    start: '2025-04-01'
    end: '2026-03-31'
  coverage_status: FY2025_target_dates_observed_values_not_audited
  usage: baseline_input
  variables:
  - system_price
  - area_price
  - sell_bid_volume
  - buy_bid_volume
  - contracted_volume
  - sell_block_bid_volume
  - buy_block_bid_volume
  - sell_block_contracted_volume
  - buy_block_contracted_volume
  todos:
  - 取得済みの元列と正規化予定列の対応を後続ETLで確認
  - 単位・***等の欠損表現・公表/改訂時点・キー一意性の意味を確認
  - 全エリア/ユニット/コマの値の完全性を後続QAで検証
  - CP932/Shift_JISの両方で同じ文字列になるため文字コード候補を併記。BOMなし
  - 日付×コマの収録監査済み。数量・価格値の欠損/妥当性は未監査
  acquisition:
    method: '公式市場画面の年度フォーム: POST /_download.php, dir=spot_summary, file=spot_summary_2025.csv。公式Refererが必要'
    manifest_path: metadata/acquisition_manifest.jsonl
    bulk_status: downloaded_fy2025
    sample_variants:
    - spot
    format_notes:
    - 'spot: CSV, HTTP MIME=application/octet-stream; name=spot_summary_2025.csv,
      encoding=ambiguous, candidates=[''cp932'', ''shift_jis''], BOM=None, delimiter='','',
      header_row=1'
    known_limitations:
    - CP932/Shift_JISの両方で同じ文字列になるため文字コード候補を併記。BOMなし
    - 日付×コマの収録監査済み。数量・価格値の欠損/妥当性は未監査
- source_id: jepx_price_sensitivity
  name: JEPX価格感応度
  reference_url: https://www.jepx.jp/electricpower/market-data/spot/
  reference_status: file_verified
  grain: 30分×市場範囲×売買方向×追加量
  primary_key_candidate:
  - delivery_date
  - period
  - market_scope
  - area
  - side
  - additional_power_kw
  - source_snapshot_id
  key_status: candidate_unverified
  information_timing: ex_ante_candidate
  intended_period:
    start: '2025-04-01'
    end: '2026-03-31'
  coverage_status: FY2025_target_dates_observed_values_not_audited
  usage: baseline_input
  variables:
  - additional_power_kw
  - hypothetical_price
  - price_difference
  - side
  todos:
  - 取得済みの元列と正規化予定列の対応を後続ETLで確認
  - 単位・***等の欠損表現・公表/改訂時点・キー一意性の意味を確認
  - 全エリア/ユニット/コマの値の完全性を後続QAで検証
  - 日付列は年月日。元列のMW表記を保持し、kWへの換算は実施しない
  - CP932/Shift_JIS候補を併記。日付×コマは監査済み、値の欠損・差分計算は未実施
  acquisition:
    method: '公式年度フォーム: dir=virtualprice/virtualprice_diffの実数値・差分2ファイル。公式Refererが必要'
    manifest_path: metadata/acquisition_manifest.jsonl
    bulk_status: downloaded_fy2025
    sample_variants:
    - sensitivity
    - sensitivity_diff
    format_notes:
    - 'sensitivity: CSV, HTTP MIME=application/octet-stream; name=virtualprice_2025.csv,
      encoding=ambiguous, candidates=[''cp932'', ''shift_jis''], BOM=None, delimiter='','',
      header_row=1'
    - 'sensitivity_diff: CSV, HTTP MIME=application/octet-stream; name=virtualprice_diff_2025.csv,
      encoding=ambiguous, candidates=[''cp932'', ''shift_jis''], BOM=None, delimiter='','',
      header_row=1'
    known_limitations:
    - 日付列は年月日。元列のMW表記を保持し、kWへの換算は実施しない
    - CP932/Shift_JIS候補を併記。日付×コマは監査済み、値の欠損・差分計算は未実施
- source_id: occto_generation
  name: OCCTOユニット別発電実績
  reference_url: https://www.occto.or.jp/assets/occtosystem2/files/20240326_yhks.pdf
  reference_status: file_verified
  grain: 30分×発電所×ユニット
  primary_key_candidate:
  - delivery_date
  - period
  - plant_key
  - unit_key
  - source_snapshot_id
  key_status: candidate_unverified
  information_timing: ex_post
  intended_period:
    start: '2025-04-01'
    end: '2026-03-31'
  coverage_status: FY2025_target_dates_observed_values_not_audited
  usage: baseline_input
  variables:
  - generation_kwh
  todos:
  - 取得済みの元列と正規化予定列の対応を後続ETLで確認
  - 単位・***等の欠損表現・公表/改訂時点・キー一意性の意味を確認
  - 全エリア/ユニット/コマの値の完全性を後続QAで検証
  - 対象日の収録365日を確認。全ユニットの各48値の完全性は未監査
  - 元時刻列は00:30[kWh]〜24:00[kWh]。開始/終了への正規化は未実施
  - 取得版の更新日時と当時の情報利用可能時点は区別して後続で確認
  acquisition:
    method: 公開利用条件→info/hks→全エリア・全発電方式検索→GET downloadCsv。FY2025は月単位で12ファイル取得
    manifest_path: metadata/acquisition_manifest.jsonl
    bulk_status: downloaded_fy2025
    sample_variants:
    - generation
    format_notes:
    - 'generation: CSV, HTTP MIME=application/csv, encoding=utf-8-sig, candidates=[''utf-8-sig''],
      BOM=UTF-8, delimiter='','', header_row=1'
    known_limitations:
    - 対象日の収録365日を確認。全ユニットの各48値の完全性は未監査
    - 元時刻列は00:30[kWh]〜24:00[kWh]。開始/終了への正規化は未実施
    - 取得版の更新日時と当時の情報利用可能時点は区別して後続で確認
